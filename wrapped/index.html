<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mika's Training Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: big headline, then one card per sport (swim, bike, run) with a weekly bar chart */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#14201d; --muted:#5c6b67; --line:#e2e8e6; --axis:#9aa7a3;
  --swim:#1f6fd1; --bike:#b98600; --run:#d1345b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18211f; --fg:#e8efed; --muted:#93a39f; --line:#26312e; --axis:#5f6e6a;
  --swim:#4f8be0; --bike:#c08a10; --run:#e0507e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18211f; --fg:#e8efed; --muted:#93a39f; --line:#26312e; --axis:#5f6e6a;
  --swim:#4f8be0; --bike:#c08a10; --run:#e0507e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
main{max-width:820px;margin:0 auto;display:grid;gap:16px}
/* opening: the whole group photo, uncropped (bikes included). Phone: photo, then title + stats.
   Desktop: photo on the left, title + stats beside it. */
.top{display:grid;gap:16px}
.banner{border-radius:16px;overflow:hidden;background:var(--line)}
.banner img{display:block;width:100%;height:auto}
.intro{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:760px){.top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 4px;font:800 clamp(40px,10vw,68px)/.92 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:56ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 10px;position:relative}
.card header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:6px}
.sport{font:700 14px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.total{font:800 clamp(34px,8vw,48px)/1 var(--display);font-variant-numeric:tabular-nums}
.total small{font-size:.42em;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-left:4px}
.facts{font-size:13px;color:var(--muted);text-align:right}
.facts b{color:var(--fg)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
/* photo row under each chart: one wide photo, or two side by side (bike) */
.photos{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin:12px 0 6px}
.photos img{display:block;width:100%;height:auto;aspect-ratio:var(--ar);object-fit:cover;border-radius:12px;background:var(--line)}
.photos.one{--ar:16/10} .photos.two{--ar:4/3}
@media (min-width:640px){.photos.one{--ar:16/9}}
.bar{fill:var(--c)}
.bar.dim{opacity:.35}
.hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgb(0 0 0/.25)}
.tip b{font-variant-numeric:tabular-nums}
/* 5 tiles under the hero: phone 2+2+1 (last spans both), desktop 3+2 (bottom two wider) */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat.wide{grid-column:1/-1}
@media (min-width:640px) and (max-width:759px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  .stat{grid-column:span 2} .stat:nth-child(5),.stat.wide{grid-column:span 3}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;min-width:0}
.stat.hero{grid-column:1/-1;background:var(--fg);color:var(--bg);border-color:var(--fg);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.stat .k{font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat.hero .k{color:inherit;opacity:.7;flex-basis:100%}
.stat .v{margin-top:6px;font:800 clamp(28px,7.5vw,40px)/1 var(--display);font-variant-numeric:tabular-nums}
.stat.hero .v{font-size:clamp(52px,14vw,84px)}
.stat .v small{font-size:.5em;margin-left:3px}
.stat .d{margin-top:4px;font-size:12.5px;color:var(--muted)}
.stat.hero .d{color:inherit;opacity:.8;font-size:15px}
</style>
</head>
<body>

  <section class="top">
    <div class="banner"><img src="images/bike-group.jpg" alt="Mika with two friends and their bikes before a ride" width="1100" height="1467"></div>

      <header>
        <div class="eyebrow" id="range"></div>

    </div>
  </section>
  <section class="card" id="swim" style="--c:var(--swim)"></section>
  <section class="card" id="bike" style="--c:var(--bike)"></section>
  <section class="card" id="run" style="--c:var(--run)"></section>

const W = DATA.weeks;
const NAME = { swim: ["Swim", "swum"], bike: ["Bike", "ridden"], run: ["Run", "run"] };
const fmtDay = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const mi = (v, k) => k === "swim" ? v.toFixed(1) : Math.round(v).toLocaleString();
const hrs = h => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };

document.getElementById("range").textContent = `${W.length} weeks · ${fmtDay(W[0].start)} – ${fmtDay(addDays(W[W.length - 1].start, 6))}, 2026`;
const tot = k => W.reduce((s, w) => s + w[k].miles, 0), totH = k => W.reduce((s, w) => s + w[k].hours, 0);
const allH = ["swim", "bike", "run"].reduce((s, k) => s + totH(k), 0);
document.getElementById("lede").textContent = `${Math.round(tot("swim") + tot("bike") + tot("run")).toLocaleString()} miles of swimming, biking and running on the way to IRONMAN California.`;

// ---- fun stats ----
const S = DATA.stats, n = v => Math.round(v).toLocaleString();
const tile = (k, v, d, cls = "") => `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
document.getElementById("stats").innerHTML =
  tile("Total training", `${n(S.hours)}<small>hours</small>`, `${S.workouts} workouts in ${W.length} weeks`, "hero")
  + tile("Longest workout", `${S.longest.miles}<small>mi</small>`, `${S.longest.kind} · ${fmtDay(S.longest.date)} · ${hrs(S.longest.hours)}`)
  + tile("Biggest day", hrs(S.bigDay.hours), `${fmtDay(S.bigDay.date)} · ${S.bigDay.what}`)
  + tile("Earliest start", S.earliest.time, `${S.earliest.kind} · ${fmtDay(S.earliest.date)}`)
  + tile("Climbed", `${n(S.climbFt)}<small>ft</small>`, `≈ ${S.everests} Everests`)
  + tile("Burned", `${n(S.kcal)}<small>cal</small>`, `≈ ${S.burritos} burritos`, "wide");

// photos per sport; pos = object-position y% chosen so faces / the full jump stay in frame at every crop
const PHOTOS = {
  swim: [{ src: "images/swim.jpg", pos: 58, alt: "Mika jumping out of the bay in her wetsuit, Alcatraz behind her" }],
  bike: [{ src: "images/bike-ferry.jpg", pos: 45, alt: "Mika and a friend with their bikes, the San Francisco skyline behind them" }],
  run: [{ src: "images/run.jpg", pos: 60, alt: "Mika smiling mid-run on a trail by a lake" }],
};
const photoRow = k => `<div class="photos ${PHOTOS[k].length > 1 ? "two" : "one"}" style="--n:${PHOTOS[k].length}">`
  + PHOTOS[k].map(p => `<img src="${p.src}" alt="${p.alt}" loading="lazy" style="object-position:50% ${p.pos}%">`).join("") + `</div>`;

function chart(k) {
  const el = document.getElementById(k), vals = W.map(w => w[k].miles);
  const max = Math.max(...vals), peak = vals.indexOf(max);
  // nice y scale: 3 gridlines
  const step = [0.5, 1, 2, 5, 10, 20, 25, 50, 100].find(s => s * 3 >= max) || 100, top = step * Math.ceil(max / step);
  // draw at the card's real pixel width so axis text stays 11px on phones
  const VW = Math.max(280, Math.round(el.clientWidth - 32)), VH = VW < 500 ? 180 : 210;
  const L = 30, R = 6, T = 24, B = 26, iw = VW - L - R, ih = VH - T - B, bw = iw / W.length, gap = 2;
  const y = v => T + ih - v / top * ih;
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${VW - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  let bars = "", hits = "", ticks = "";
  W.forEach((w, i) => {
    const x = L + i * bw + gap / 2, h = Math.max(0, y(0) - y(w[k].miles)), r = Math.min(4, h / 2, (bw - gap) / 2);
    if (h > 0) bars += `<path class="bar" d="M${x},${y(0)} V${y(0) - h + r} Q${x},${y(0) - h} ${x + r},${y(0) - h} H${x + bw - gap - r} Q${x + bw - gap},${y(0) - h} ${x + bw - gap},${y(0) - h + r} V${y(0)} Z"/>`;
    hits += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${ih + B}"/>`;
    const d = new Date(w.start + "T12:00:00");
    if (i === 0 || d.getDate() <= 7) ticks += `<text x="${L + i * bw + bw / 2}" y="${VH - 6}" text-anchor="middle">${d.toLocaleDateString("en-US", { month: "short" })}</text>`;
  });
  el.innerHTML = `<header><div><div class="sport">${NAME[k][0]}</div><div class="total">${mi(tot(k), k)}<small>miles ${NAME[k][1]}</small></div></div>
    <div class="facts"><b>${hrs(totH(k))}</b> total</div></header>
    <svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${NAME[k][0]} miles per week, up to ${mi(max, k)} miles in a week">
      ${g}<line x1="${L}" x2="${VW - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>${bars}${ticks}${hits}</svg>${photoRow(k)}`;
  const svg = el.querySelector("svg"), tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true; el.appendChild(tip);
  const show = e => {
    const i = +e.target.dataset.i, w = W[i], b = svg.getBoundingClientRect(), c = el.getBoundingClientRect(), s = b.width / VW;
    tip.innerHTML = `Week of ${fmtDay(w.start)}<br><b>${mi(w[k].miles, k)} mi</b> · ${hrs(w[k].hours)} · ${w[k].sessions} session${w[k].sessions === 1 ? "" : "s"}`;
    tip.style.left = `${b.left - c.left + (L + i * bw + bw / 2) * s}px`;
    tip.style.top = `${b.top - c.top + Math.min(y(w[k].miles), y(0) - 4) * s - 8}px`;
    tip.hidden = false;
    svg.querySelectorAll(".bar").forEach(p => p.classList.add("dim"));
    const bar = [...svg.querySelectorAll(".bar")][W.slice(0, i).filter(x => x[k].miles > 0).length];
    if (w[k].miles > 0 && bar) bar.classList.remove("dim");
  };
  const hide = () => { tip.hidden = true; svg.querySelectorAll(".bar").forEach(p => p.classList.remove("dim")); };
  svg.querySelectorAll(".hit").forEach(h => { h.addEventListener("mouseenter", show); h.addEventListener("click", show); });
  svg.addEventListener("mouseleave", hide);
}
["swim", "bike", "run"].forEach(chart);
let lastW = innerWidth, rt;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => ["swim", "bike", "run"].forEach(chart), 150); });
</script>
